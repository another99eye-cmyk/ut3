<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Play — XT³ Ultimate Tic-Tac-Toe</title>
<meta name="description" content="Play Ultimate Tic-Tac-Toe with a friend on one device, against the computer, or online with a room code." />

<script>
  // Set the theme before any CSS paints, so there's no flash of the wrong theme.
  (function () {
    try {
      var raw = window.localStorage.getItem("ultimateTTT:theme");
      var stored = raw ? JSON.parse(raw) : null;
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* localStorage unavailable, default styles apply */ }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/game.css" />
<link rel="stylesheet" href="../css/animation.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="game-shell">

<!-- reusable piece glyphs (same sprite as the landing page) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="glyph-x" viewBox="0 0 40 40">
    <path d="M8 8 L32 32 M32 8 L8 32" stroke="var(--x-color)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </symbol>
  <symbol id="glyph-o" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="12.5" stroke="var(--o-color)" stroke-width="6.5" fill="none"/>
  </symbol>
</svg>

<a class="visually-hidden" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__bar">
    <a class="logo" href="../index.html" aria-label="XT-cubed, Ultimate Tic-Tac-Toe home">
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><use href="#glyph-x"/></svg>
      </span>
      XT³
    </a>
    <div class="game-header__controls">
      <button class="icon-btn" type="button" id="sound-toggle" aria-pressed="true" aria-label="Toggle sound">
        <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
          <path d="M17.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
          <path d="M16 9l5 6M21 9l-5 6"/>
        </svg>
      </button>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
      </button>
      <a class="btn" href="../index.html">Main menu</a>
    </div>
  </div>
</header>

<main id="main" class="game-page">
  <div class="wrap game-page__inner">

    <section class="game-meta" aria-label="Match info">
      <div class="game-meta__row">
        <span class="badge" id="mode-indicator">Two player</span>
        <span class="badge badge--muted" id="difficulty-indicator-wrap" hidden>
          Difficulty: <strong id="difficulty-indicator">Medium</strong>
        </span>
      </div>

      <div class="scoreboard" role="group" aria-label="Scoreboard">
        <div class="scoreboard__item scoreboard__item--x">
          <span class="scoreboard__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#glyph-x"/></svg></span>
          <span>
            <span class="scoreboard__name" id="player-x-name">Player X</span><br />
            <strong class="scoreboard__score" id="score-x">0</strong>
          </span>
        </div>

        <div class="scoreboard__item scoreboard__item--draw">
          <span>Draws</span>
          <strong id="score-draw">0</strong>
        </div>

        <div class="scoreboard__item scoreboard__item--o">
          <span>
            <span class="scoreboard__name" id="player-o-name">Player O</span><br />
            <strong class="scoreboard__score" id="score-o">0</strong>
          </span>
          <span class="scoreboard__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#glyph-o"/></svg></span>
        </div>
      </div>

      <div class="turn-banner" aria-live="polite">
        <span class="turn-dot turn-dot--x" id="current-player-dot" aria-hidden="true"></span>
        <span id="current-player-label">Player 1&rsquo;s turn</span>
      </div>
    </section>

    <div class="board-wrap">
      <div id="ultimate-board" class="ultimate-board ultimate-board--game" aria-label="Ultimate Tic-Tac-Toe board"></div>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Game controls">
      <button class="bottom-nav__btn" type="button" id="restart-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.6 5.9M20 5v6h-6"/>
        </svg>
        <span>Restart</span>
      </button>
      <button class="bottom-nav__btn" type="button" id="undo-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/>
        </svg>
        <span>Undo</span>
      </button>
      <button class="bottom-nav__btn" type="button" id="redo-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 7 20 12l-5 5M20 12H9a5 5 0 0 0 0 10h1"/>
        </svg>
        <span>Redo</span>
      </button>
      <button class="bottom-nav__btn" type="button" id="pause-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M8 6v12M16 6v12"/>
        </svg>
        <span>Pause</span>
      </button>
    </nav>

  </div>
</main>

<div class="victory-overlay" id="victory-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="victory-title">
  <div class="victory-card">
    <div class="victory-card__icon" id="victory-icon" aria-hidden="true"></div>
    <h2 id="victory-title">Player X wins!</h2>
    <p id="victory-sub">Three boards in a row across the ultimate grid.</p>
    <div class="victory-card__actions">
      <button class="btn btn--primary" type="button" id="rematch-btn">Rematch</button>
      <a class="btn" id="main-menu-btn" href="../index.html">Main menu</a>
    </div>
  </div>
</div>

<div class="victory-overlay" id="pause-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
  <div class="victory-card">
    <div class="victory-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M8 6v12M16 6v12"/>
      </svg>
    </div>
    <h2 id="pause-title">Paused</h2>
    <p>Your board is exactly as you left it.</p>
    <div class="victory-card__actions victory-card__actions--stack">
      <button class="btn btn--primary" type="button" id="resume-btn">Play / Resume</button>
      <button class="btn" type="button" id="pause-restart-btn">Restart</button>
      <a class="btn" id="pause-menu-btn" href="../index.html">Main menu</a>
    </div>
  </div>
</div>

<div class="victory-overlay" id="online-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="online-title">
  <div class="victory-card">
    <div class="victory-card__icon" id="online-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
      </svg>
    </div>
    <h2 id="online-title">Connecting&hellip;</h2>
    <p id="online-sub">Setting things up.</p>
    <div class="online-room-code" id="online-room-code" hidden>
      <span class="online-room-code__label">Room code</span>
      <span class="online-room-code__value" id="online-code-text">ABCDE</span>
      <button class="btn" type="button" id="copy-link-btn">Copy invite link</button>
    </div>
    <div class="victory-card__actions victory-card__actions--stack">
      <a class="btn" href="../index.html">Main menu</a>
    </div>
  </div>
</div>

<div id="live-region" class="visually-hidden" aria-live="polite"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/animation.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/online.js"></script>
<script src="../js/game.js"></script>
</body>
</html>
